[project]
name = "deixis"
version = "0.0.1"
description = "Witnessed Relational Spatial IR with Deferred Grounding — relation-first spatial description (RCC-8 + contact witnesses + typed grounding), for Grasshopper and standalone."
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12", "pyrsistent>=0.20", "networkx>=3.0"]

[project.optional-dependencies]
geom = ["shapely>=2.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
