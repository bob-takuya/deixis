<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="architecture"><rect width="820" height="360" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1b1f24" text-anchor="start" font-weight="600" style="">図4  Witnessed Multi-Representation Spatial IR の構成</text><text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400" style="">単一の witnessed cell complex K ＋単一 identity/provenance ストアを共有し、型の異なる carrier を明示 adapter で接続。</text><rect x="40" y="78" width="470" height="34" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="52" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="400" style="">Geometry (Brep/box, Fraction)</text><rect x="40" y="122" width="470" height="34" rx="2" fill="#f3e6de" stroke="#b47f5b" stroke-width="1.4"/><text x="52" y="144" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="400" style="">Relation-view: RCC-8 + IncidenceWitness + status</text><rect x="40" y="166" width="470" height="34" rx="2" fill="#e3efe4" stroke="#5ba36a" stroke-width="1.4"/><text x="52" y="188" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="400" style="">Field-view: DEC 0/1/2-cochain, Scalar/Direction</text><rect x="40" y="210" width="470" height="34" rx="2" fill="#efe7f3" stroke="#8a5bb4" stroke-width="1.4"/><text x="52" y="232" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="400" style="">Overlay-view: signature poset</text><rect x="560" y="78" width="230" height="166" rx="2" fill="#fbfcfd" stroke="#c7ccd2" stroke-width="1"/><text x="675" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">connectors (lens 規律)</text><text x="575" y="122" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f24" text-anchor="start" font-weight="400" style="">• Lift / Solve  (幾何↔関係)</text><text x="575" y="148" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f24" text-anchor="start" font-weight="400" style="">• level-set 閾値 = grounding</text><text x="575" y="174" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f24" text-anchor="start" font-weight="400" style="">• Poincaré ⋆ (多様体ガード)</text><text x="575" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f24" text-anchor="start" font-weight="400" style="">• overlay signature</text><rect x="40" y="268" width="750" height="40" rx="2" fill="#f2f5f8" stroke="#5b7fb4" stroke-width="1.4"/><text x="415" y="285" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">単一運用 calculus: status(invariant|grounded|delegated) / ground・unground / verify(exact+逆) / preserve(D(E(x))≅_O x)</text><text x="415" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">= 関係制約族と保存制約族の両方へ一様に効く（決定権配分の軸が「何を固定/幾何か関係か/部屋か連続場か」を統べる）</text></svg>