<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Deixis for Grasshopper"><rect width="900" height="260" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1b1f24" text-anchor="start" font-weight="600" style="">図6  Deixis for Grasshopper：挿入可能な関係制御・再合成ステージ</text><text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400" style="">既存プラグイン（Kangaroo/Wasp/手動）の幾何を Lift で関係層へ持ち上げ、関係/決定を編集し、Solve で幾何へ再合成して下流へ。</text><rect x="30" y="100" width="140" height="60" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.6"/><text x="100.0" y="126" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">上流幾何</text><text x="100.0" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">(任意plugin)</text><defs><marker id="ah3735" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="170" y1="130.0" x2="210" y2="130.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah3735)"/><rect x="210" y="100" width="140" height="60" rx="2" fill="#f3e6de" stroke="#b47f5b" stroke-width="1.6"/><text x="280.0" y="126" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">Lift</text><text x="280.0" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">(観測)</text><defs><marker id="ah1161" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="350" y1="130.0" x2="390" y2="130.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah1161)"/><rect x="390" y="100" width="140" height="60" rx="2" fill="#efe7f3" stroke="#8a5bb4" stroke-width="1.6"/><text x="460.0" y="126" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">Relate/Witness</text><text x="460.0" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">Ground</text><defs><marker id="ah7071" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="530" y1="130.0" x2="570" y2="130.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah7071)"/><rect x="570" y="100" width="140" height="60" rx="2" fill="#e3efe4" stroke="#5ba36a" stroke-width="1.6"/><text x="640.0" y="126" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">Solve</text><text x="640.0" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">(再合成)</text><defs><marker id="ah8169" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="710" y1="130.0" x2="750" y2="130.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah8169)"/><rect x="750" y="100" width="140" height="60" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.6"/><text x="820.0" y="126" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="600" style="">下流</text><text x="820.0" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="middle" font-weight="400" style="">(日照/構造…)</text><rect x="570" y="210" width="140" height="36" rx="2" fill="#f6f8fa" stroke="#2f8f5b" stroke-width="1.4"/><text x="640.0" y="233" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2f8f5b" text-anchor="middle" font-weight="600" style="">Verify (逆照合)</text><defs><marker id="ah7849" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="640.0" y1="160" x2="640.0" y2="210" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah7849)"/><text x="30" y="235" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">spec は JSON 文字列でワイヤを流れる（level-2）。Solve は relation-preserving resynthesis（元トポロジー/部材は保たない）。</text></svg>