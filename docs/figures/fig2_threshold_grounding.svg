<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="demo5 threshold grounding"><rect width="760" height="300" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1b1f24" text-anchor="start" font-weight="600" style="">図2  閾値は決定権が宿る場所（同じ場・違う τ で違う部屋）</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400" style="">連続な帰属場を未 ground のまま保持＝部屋に区切れない空間。閾値化＝GroundingDecision（場→部屋）。</text><rect x="60" y="186.0" width="112" height="24.0" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="116.0" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">c0</text><text x="116.0" y="180.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b7480" text-anchor="middle" font-weight="400" style="">1/5</text><rect x="180" y="150.0" width="112" height="60.0" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="236.0" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">c1</text><text x="236.0" y="144.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b7480" text-anchor="middle" font-weight="400" style="">1/2</text><rect x="300" y="138.0" width="112" height="72.0" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="356.0" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">c2</text><text x="356.0" y="132.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b7480" text-anchor="middle" font-weight="400" style="">3/5</text><rect x="420" y="102.0" width="112" height="108.0" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="476.0" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">c3</text><text x="476.0" y="96.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b7480" text-anchor="middle" font-weight="400" style="">9/10</text><rect x="540" y="186.0" width="112" height="24.0" rx="2" fill="#dfe7f3" stroke="#5b7fb4" stroke-width="1.4"/><text x="596.0" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="middle" font-weight="400" style="">c4</text><text x="596.0" y="180.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b7480" text-anchor="middle" font-weight="400" style="">1/5</text><line x1="50" y1="150.0" x2="652" y2="150.0" stroke="#b47f5b" stroke-width="1.8" stroke-dasharray="5 3"/><text x="660" y="154.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#b47f5b" text-anchor="start" font-weight="600" style="">τ=1/2 → 部屋= cells [1, 2, 3]</text><line x1="50" y1="114.0" x2="652" y2="114.0" stroke="#5ba36a" stroke-width="1.8" stroke-dasharray="5 3"/><text x="660" y="118.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5ba36a" text-anchor="start" font-weight="600" style="">τ=4/5 → 部屋= cells [3]</text><text x="60" y="262" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">各 τ は台帳に残る型付き GroundingDecision（誰が/なぜ）。argmax で全格子を分割すれば「部屋分割」＝特殊な ground。</text></svg>