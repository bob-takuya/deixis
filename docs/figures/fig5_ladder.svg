<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="fail-closed ladder"><rect width="760" height="300" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1b1f24" text-anchor="start" font-weight="600" style="">図5  fail-closed な realizability ラダー</text><text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400" style="">下流出力（BOM/施工図/採用）は到達した最上位でのみ許可。unsat-in-D ≠ 不可能、unknown は不採用（fail-closed）。</text><rect x="40" y="240" width="320" height="34" rx="2" fill="#f6f8fa" stroke="#c7ccd2" stroke-width="2"/><text x="52" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="600" style="">abstract</text><text x="375" y="262" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">型として整合（未検査）</text><defs><marker id="ah6962" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="200" y1="240" x2="200" y2="230" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah6962)"/><rect x="40" y="196" width="320" height="34" rx="2" fill="#f6f8fa" stroke="#5b7fb4" stroke-width="2"/><text x="52" y="218" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="600" style="">rcc_consistent</text><text x="375" y="218" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">RCC-8 記号整合（tractable fragment 内で健全かつ完全）</text><defs><marker id="ah7017" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="200" y1="196" x2="200" y2="186" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah7017)"/><rect x="40" y="152" width="320" height="34" rx="2" fill="#f6f8fa" stroke="#2f8f5b" stroke-width="2"/><text x="52" y="174" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="600" style="">realized_in_selected_domain_D</text><text x="375" y="174" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">選択ドメイン D（直交box）で Z3 実現＋逆検証</text><defs><marker id="ah2751" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7480"/></marker></defs><line x1="200" y1="152" x2="200" y2="142" stroke="#6b7480" stroke-width="1.6" marker-end="url(#ah2751)"/><rect x="40" y="108" width="320" height="34" rx="2" fill="#f6f8fa" stroke="#5ba36a" stroke-width="2"/><text x="52" y="130" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="600" style="">fabrication_valid</text><text x="375" y="130" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480" text-anchor="start" font-weight="400" style="">建築的許容述語（開口幅/階高/接地…）を満たす</text></svg>